plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
	maven { url = "https://api.modrinth.com/maven" }
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"bbs_animtweaker_addon" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:1.20.1+build.10:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// BBS FS Local Project Dependency
	modCompileOnly "mchorse:bbs:2.3.1-1.20.1"
	modClientCompileOnly "mchorse:bbs:2.3.1-1.20.1"

	// BBS Addon Engine Local Project Dependency
	modCompileOnly "ElGatoPro300:bbs-addon-engine:1.1.0"
	modClientCompileOnly "ElGatoPro300:bbs-addon-engine:1.1.0"

	// AAA Particles (users must have this installed at runtime)
	modCompileOnly "maven.modrinth:aaa-particles:${project.aaa_version}"
	modClientCompileOnly "maven.modrinth:aaa-particles:${project.aaa_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version
	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName
	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
}
