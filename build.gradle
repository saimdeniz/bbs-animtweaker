plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenLocal()
	maven { url = "https://api.modrinth.com/maven" }
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"bbs_animtweaker_addon" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// BBS FS 2.6 Local Dependency
	modImplementation("mchorse:bbs:${project.bbs_version}") { transitive = false }
}

// Loom cache refresh helper from BBS 2.6 addon-template
def bbsJar = new File(new File(System.getProperty("user.home")), ".m2/repository/mchorse/bbs/${project.bbs_version}/bbs-${project.bbs_version}.jar")
def remapCache = file(".gradle/loom-cache/remapped_mods/remapped/mchorse")

if (bbsJar.exists() && remapCache.exists() && bbsJar.lastModified() > remapCache.lastModified()) {
	logger.lifecycle("BBS was rebuilt since it was last remapped — clearing ${remapCache}")
	delete(remapCache)
}

processResources {
	def version = project.version
	inputs.property "version", version
	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}
